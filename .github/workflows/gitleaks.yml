name: Secrets scan
# This repository is public. Every push and pull request is scanned with
# gitleaks over the full git history, so a leaked key can never land on main
# unnoticed. Runs the pinned gitleaks binary directly (no license needed).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o /tmp/checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" /tmp/checksums.txt | sed 's#  .*#  /tmp/gitleaks.tar.gz#' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Refuse PR-controlled scanner policy
        # A PR must not be able to weaken the scan it is subject to: no new or
        # changed .gitleaks.toml / .gitleaksignore, and no newly added inline
        # `gitleaks:allow` markers. Maintainers change policy on main directly.
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE" "$HEAD" | grep -Ex '(\.gitleaks\.toml|\.gitleaksignore|.*/\.gitleaks\.toml|.*/\.gitleaksignore)'; then
            echo "::error::this PR adds or changes gitleaks policy files; do that on main with maintainer review"; exit 1
          fi
          if git diff "$BASE" "$HEAD" | grep -E '^\+.*gitleaks:allow'; then
            echo "::error::this PR adds inline gitleaks:allow markers; remove them or justify on main"; exit 1
          fi
          echo "scanner policy untouched by this PR"
      - name: Scan full history
        # Default built-in rules only: no repo-provided config is honoured.
        run: |
          test ! -e .gitleaks.toml || { echo "::error::.gitleaks.toml present on this branch; the scan does not accept repo-local policy"; exit 1; }
          gitleaks detect --source . --redact --no-banner --exit-code 1 -v
